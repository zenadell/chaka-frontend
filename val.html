<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>celebrate valentine with your favorite girl Chaka 🥰🤭</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0055;
            --dark: #050505;
            --card-bg: rgba(20, 20, 20, 0.85);
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--dark);
            font-family: 'Outfit', sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ATMOSPHERE BACKGROUND */
        .bg-blur {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('chaka-tease.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(30px) brightness(0.4);
            z-index: -1;
            transform: scale(1.1);
        }

        /* MAIN CARD */
        .container {
            width: 90%;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* IMAGE AREA */
        .image-wrapper {
            width: 100%;
            height: 320px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 0, 85, 0.3);
            position: relative;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        /* STATUS BADGES */
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .badge.speaking .badge-dot { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .badge.listening .badge-dot { background: #ff0055; animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0.4; } }

        /* TEXT */
        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #fff, #ff99ac);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            color: #bbb;
            min-height: 24px;
            margin-bottom: 20px;
        }

        /* VISUALIZER */
        .visualizer {
            display: flex;
            gap: 4px;
            height: 30px;
            margin-bottom: 25px;
            justify-content: center;
            align-items: center;
            opacity: 0.3;
        }
        .visualizer.active { opacity: 1; }
        
        .bar {
            width: 5px;
            background: var(--primary);
            border-radius: 2px;
            height: 5px;
            transition: height 0.1s;
        }
        
        /* Simulating audio wave via CSS animation class */
        .visualizer.active .bar { animation: wave 0.4s infinite alternate; }
        .bar:nth-child(1) { animation-delay: 0.0s; }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        
        @keyframes wave { 0% { height: 5px; } 100% { height: 30px; } }

        /* BUTTONS */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 20px rgba(255, 0, 85, 0.4);
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:disabled { background: #333; cursor: not-allowed; opacity: 0.7; }
        
        /* Hidden UI elements */
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <div class="container">
        
        <div class="image-wrapper">
            <div class="badge" id="status-badge">
                <div class="badge-dot"></div>
                <span id="badge-text">Offline</span>
            </div>
            <img src="chaka-tease.jpg" alt="Chaka" class="hero-image" id="avatar">
        </div>

        <h1>Hey Single Pringle... 😏 happy valentine</h1>
        <div class="subtitle" id="status-text">Ready to talk?</div>

        <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div>
        </div>

        <button class="btn" id="start-btn" onclick="startInteraction()">
            chaka wants to talk to you!
        </button>

        <button class="btn hidden" style="background: white; color: black;" id="chat-btn" onclick="goToChat()">
            chat with chaka❤️
        </button>
    </div>

    <script>
        /* --- CONFIGURATION --- */
        const API_KEYS = [
            "AIzaSyAw6jxRs91Vmm6ppJkGMlW2LK-sLP29jeY",
            "AIzaSyDziQw-21dxt_hHxILBO_JL0e-Sm09JMZk",
            "AIzaSyDpE_5_mnRfKB0TjCg6gccQ-IoDuRBNEUI",
            "AIzaSyBrNaqEUlc9pg5J-m9REBp3uyLua0soZwE",
            "AIzaSyBfDH-F0jlDsduSqF2rNpZjSJbyPIZxX1o"
            // Add up to 7 keys if needed
        ];
        const MODEL_NAME = "gemini-2.5-flash-preview-tts";
        const VOICE_NAME = "Aoede";

        // Key rotation helpers
        let currentKeyIndex = 0;
        const keyState = API_KEYS.map(() => ({ failures: 0, lastFailedAt: 0 }));
        const FAILURE_COOLDOWN_MS = 30 * 1000; // 30s cooldown before retrying a failed key

        function getCurrentKey() { return API_KEYS[currentKeyIndex]; }
        function rotateKey() {
            currentKeyIndex = (currentKeyIndex + 1) % API_KEYS.length;
            console.warn(`Switched to API Key #${currentKeyIndex + 1}`);
        }
        function markKeyFailed(index) {
            keyState[index].failures += 1;
            keyState[index].lastFailedAt = Date.now();
        }
        function isKeyInCooldown(index) {
            const last = keyState[index].lastFailedAt || 0;
            return Date.now() - last < FAILURE_COOLDOWN_MS;
        }

        /* --- STATE VARIABLES --- */
        let audioCtx;
        let nextStartTime = 0;
        let conversationStep = 0; // 0 = Start, 1 = User Spoke, 2 = Done
        let recognition; // For Speech-to-Text

        // --- 1. THE BRAIN (LLM CALL) ---
        async function getChakaResponse(userText = "", retries = 0) {
            
            // Define Prompt based on step
            let prompt = "";
            
            if (conversationStep === 0) {
                // FIRST TURN: Roast & Question
                prompt = `
                    Role: Chaka, Flirty/Sassy AI. 
                    Context: User called you. 
                    Task: Laugh hard ("Hahahaha!"). Then ask: "So, why are you single on Valentine's Day? Be honest." 
                    Tone: Playful, fast.
                `;
            } else {
                // SECOND TURN: React to User's Excuse
                prompt = `
                    Role: Chaka, Flirty AI.
                    Context: You asked why they are single. User replied: "${userText}".
                    Task: Mock their excuse playfully. Laugh. Then say: "Okay, that's enough excuses. Come chat with me properly inside."
                    Tone: Sarcastic but warm at the end.
                `;
            }

            // Stop if we tried every key
            if (retries >= API_KEYS.length) {
                updateStatus("System Overload (All Keys Failed).", "error");
                return;
            }

            // Call Gemini API
            try {
                // Skip keys that are in cooldown
                let attempts = 0;
                while (attempts < API_KEYS.length && isKeyInCooldown(currentKeyIndex)) {
                    rotateKey();
                    attempts++;
                }

                const activeKey = getCurrentKey();
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:streamGenerateContent?alt=sse&key=${activeKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseModalities: ["audio"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: VOICE_NAME } } }
                        }
                    })
                });

                // Key rotation on failure
                if (!response.ok) {
                    markKeyFailed(currentKeyIndex);
                    console.warn(`Key failed (Status: ${response.status}). Rotating...`);
                    rotateKey();
                    await getChakaResponse(userText, retries + 1);
                    return;
                }

                // Success: process the stream
                processAudioStream(response.body);

            } catch (e) {
                console.error(e);
                markKeyFailed(currentKeyIndex);
                rotateKey();
                if (retries < API_KEYS.length) {
                    await getChakaResponse(userText, retries + 1);
                } else {
                    updateStatus("Connection failed.", "error");
                }
            }
        }

        // --- 2. AUDIO STREAM HANDLER (PCM) ---
        async function processAudioStream(streamBody) {
            updateStatus("Chaka is speaking...", "speaking");
            
            const reader = streamBody.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let streamFinished = false;

            // Initialize Audio Context if needed
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            nextStartTime = audioCtx.currentTime;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n");
                buffer = lines.pop();

                for (const line of lines) {
                    if (line.trim().startsWith("data:")) {
                        const jsonStr = line.replace("data: ", "").trim();
                        if (jsonStr === "[DONE]") break;
                        try {
                            const data = JSON.parse(jsonStr);
                            const part = data.candidates?.[0]?.content?.parts?.[0];
                            if (part?.inlineData) {
                                scheduleAudioChunk(part.inlineData.data);
                            }
                        } catch (e) {}
                    }
                }
            }
            
            // Calculate when Chaka finishes speaking
            const remainingTime = (nextStartTime - audioCtx.currentTime) * 1000;
            
            setTimeout(() => {
                // AUDIO FINISHED EVENT
                handleTurnComplete(); 
            }, remainingTime + 500); // Small buffer
        }

        function scheduleAudioChunk(base64) {
            const binary = atob(base64);
            const len = binary.length;
            const bytes = new Int16Array(len / 2);
            for (let i = 0; i < len; i += 2) {
                bytes[i / 2] = (binary.charCodeAt(i) & 0xff) | ((binary.charCodeAt(i + 1) & 0xff) << 8);
            }
            const float32 = new Float32Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) float32[i] = bytes[i] / 32768;

            const buffer = audioCtx.createBuffer(1, float32.length, 24000);
            buffer.getChannelData(0).set(float32);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(Math.max(audioCtx.currentTime, nextStartTime));
            nextStartTime += buffer.duration;
        }

        // --- 3. CONVERSATION FLOW ---
        function startInteraction() {
            document.getElementById('start-btn').classList.add('hidden');
            conversationStep = 0;
            getChakaResponse(); // Trigger Turn 1 (Roast)
        }

        function handleTurnComplete() {
            updateStatus("...", "idle");
            
            if (conversationStep === 0) {
                // Turn 1 Done -> Start Listening to User
                startListening();
            } else if (conversationStep === 1) {
                // Turn 2 Done -> Show Chat Button
                updateStatus("Call Ended.", "idle");
                document.getElementById('chat-btn').classList.remove('hidden');
            }
        }

        // --- 4. SPEECH RECOGNITION (EARS) ---
        function startListening() {
            // Check browser support
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Your browser doesn't support speech recognition. Use Chrome.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            updateStatus("Listening to your excuse...", "listening");

            recognition.start();

            recognition.onresult = (event) => {
                const userSpeech = event.results[0][0].transcript;
                console.log("User said:", userSpeech);
                updateStatus("Processing...", "idle");
                
                // Move to next step and Respond
                conversationStep = 1; 
                getChakaResponse(userSpeech);
            };

            recognition.onerror = (event) => {
                console.error("Speech error", event.error);
                // Fallback if mic fails: just assume they said nothing and proceed
                conversationStep = 1;
                getChakaResponse("I am too shy to speak.");
            };
            
            recognition.onend = () => {
                // If silence, we could restart or just move on. 
                // For this demo, we rely on onresult.
            };
        }

        // --- 5. UI UPDATES ---
        function updateStatus(text, state) {
            document.getElementById('status-text').innerText = text;
            
            const badgeText = document.getElementById('badge-text');
            const badge = document.getElementById('status-badge');
            const visualizer = document.getElementById('visualizer');
            const avatar = document.getElementById('avatar');

            // Reset classes
            badge.classList.remove('speaking', 'listening');
            visualizer.classList.remove('active');
            avatar.style.transform = "scale(1)";

            if (state === 'speaking') {
                badge.classList.add('speaking');
                badgeText.innerText = "Chaka Speaking";
                visualizer.classList.add('active');
                avatar.style.transform = "scale(1.05)";
            } else if (state === 'listening') {
                badge.classList.add('listening');
                badgeText.innerText = "Listening...";
                // Visual cue for listening
                avatar.style.transform = "scale(0.95)";
            } else {
                badgeText.innerText = "Online";
            }
        }

        function goToChat() {
            window.location.href = "index.html?mode=valentine_redemption";
        }

    </script>
</body>
</html>
