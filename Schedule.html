<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chaka AI - Executive V11 (Live)</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --surface: #0a0a0a;
            --surface-glass: rgba(10, 10, 10, 0.6);
            --border: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.12);
            --glass-blur: blur(32px);
            --glass-saturate: saturate(200%);
            --ai-color: #00f3ff;
            /* Updated to Cyan for Cyberpunk feel */
            --ai-glow: rgba(0, 243, 255, 0.3);
            --accent: #ec4899;
            --success: #059669;
            --recording: #ff0055;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #475569;
            --radius-md: 18px;
            --radius-full: 9999px;
            --sidebar-width: 340px;
            --feed-width: 400px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            cursor: default;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            font-size: 14px;
            position: relative;
        }

        /* Neural Background */
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Sidebar Layouts */
        aside {
            height: 100vh;
            background: var(--surface-glass);
            backdrop-filter: var(--glass-blur) var(--glass-saturate);
            z-index: 60;
            padding: 50px 32px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            border-right: 1px solid var(--border);
            width: var(--sidebar-width);
            transition: transform 0.3s ease;
        }

        #neural-feed {
            border-right: none;
            border-left: 1px solid var(--border);
            width: var(--feed-width);
        }

        @media (max-width: 1200px) {
            aside {
                display: none;
            }
        }

        /* Main Content */
        #content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        header {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border);
        }

        .brand h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
        }

        .brand span {
            font-size: 0.7rem;
            color: var(--ai-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Live Status Indicator */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #555;
            transition: all 0.3s;
        }

        .live-indicator.active {
            border-color: var(--ai-color);
            color: var(--ai-color);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .live-indicator.active .live-dot {
            background: var(--ai-color);
            box-shadow: 0 0 10px var(--ai-color);
        }

        /* Task Cards */
        #timeline {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            overflow-y: auto;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: 0.2s;
        }

        .task-card:hover {
            border-color: var(--ai-color);
            transform: translateY(-2px);
        }

        .task-time {
            font-family: 'JetBrains Mono';
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .task-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .task-tag {
            font-size: 0.65rem;
            color: var(--ai-color);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* AI Bar (Bottom Control) */
        .ai-bar-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }

        /* Visualizer Canvas */
        #vis-canvas {
            width: 100%;
            height: 60px;
            opacity: 0;
            transition: opacity 0.5s;
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }

        #vis-canvas.active {
            opacity: 1;
        }

        .ai-bar {
            width: 100%;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.3s;
        }

        .ai-bar.active {
            border-color: var(--ai-color);
            box-shadow: 0 0 30px var(--ai-glow);
        }

        .connect-btn {
            background: var(--ai-color);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: 0.2s;
        }

        .connect-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--ai-glow);
        }

        .connect-btn.active {
            background: var(--recording);
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 0, 85, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 85, 0);
            }
        }

        .status-text {
            color: var(--text-dim);
            font-size: 0.8rem;
            flex: 1;
            text-align: center;
            font-family: 'JetBrains Mono';
        }

        /* Terminal Logs */
        .neuro-terminal {
            flex: 1;
            overflow-y: auto;
            font-family: 'JetBrains Mono';
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
            mask-image: linear-gradient(to bottom, transparent, black 10%);
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .log-sys {
            color: #555;
        }

        .log-user {
            color: #fff;
            font-weight: bold;
        }

        .log-ai {
            color: var(--ai-color);
        }

        .log-tool {
            color: var(--accent);
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.open {
            display: flex;
        }

        .modal-box {
            background: #111;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
        }

        input[type="password"] {
            background: #222;
            border: 1px solid #333;
            padding: 10px;
            color: white;
            width: 100%;
            margin: 15px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <canvas id="neural-bg"></canvas>

    <aside>
        <div class="sidebar-header">
            <h2
                style="font-size: 0.75rem; color: var(--ai-color); letter-spacing: 0.2em; text-transform: uppercase; font-weight: 800;">
                Command Center</h2>
            <p style="color:var(--text-dim); font-size:0.7rem;">CHAKA OS V11 LIVE</p>
        </div>
        <div style="flex:1;"></div>
        <div
            style="padding: 20px; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid var(--border);">
            <div style="font-size: 0.7rem; color: #888; margin-bottom: 10px;">SYSTEM STATUS</div>
            <div id="connectionState" style="color: var(--text-dim); font-family: 'JetBrains Mono'; font-size: 0.8rem;">
                DISCONNECTED</div>
        </div>
    </aside>

    <div id="content-wrapper">
        <header>
            <div class="brand">
                <h1>CHAKA</h1>
                <span>Executive Neural OS</span>
            </div>
            <div style="display:flex; gap:15px; align-items:center;">
                <span id="keyStatus"
                    style="color:var(--text-dim); font-size:0.7rem; font-family:'JetBrains Mono'; margin-right:5px;"></span>
                <button onclick="app.openKeyModal()"
                    style="background:transparent; border:1px solid var(--border); color:var(--text-dim); padding:8px 16px; border-radius:20px; font-size:0.7rem; font-weight:700; cursor:pointer; transition:0.2s;"
                    onmouseover="this.style.borderColor='var(--ai-color)'; this.style.color='var(--ai-color)'"
                    onmouseout="this.style.borderColor='var(--border)'; this.style.color='var(--text-dim)'">KEY</button>
                <div class="live-indicator" id="liveIndicator">
                    <div class="live-dot"></div>
                    <span>LIVE UPLINK</span>
                </div>
            </div>
        </header>

        <main id="timeline">
        </main>

        <div class="ai-bar-container">
            <canvas id="vis-canvas"></canvas>
            <div class="ai-bar" id="aiBar">
                <button class="connect-btn" id="toggleBtn" onclick="app.toggleSession()">INITIALIZE</button>
                <span class="status-text" id="statusText">System Ready</span>
            </div>
        </div>
    </div>

    <aside id="neural-feed">
        <div class="sidebar-header">
            <h2
                style="font-size: 0.75rem; color: var(--ai-color); letter-spacing: 0.2em; text-transform: uppercase; font-weight: 800;">
                Neural Feed</h2>
            <p style="color:var(--text-dim); font-size:0.7rem;">Real-time Reasoning</p>
        </div>
        <div class="neuro-terminal" id="terminal"></div>
    </aside>

    <div class="modal" id="keyModal">
        <div class="modal-box" style="width: 500px;">
            <h3>SECURITY PROTOCOLS</h3>
            <div id="keyList"
                style="display:flex; flex-direction:column; gap:8px; margin:20px 0; max-height:150px; overflow-y:auto; overflow-x:hidden;">
            </div>
            <input type="password" id="apiKeyInput" placeholder="Paste NEW Key to Add..." style="text-align:center;">
            <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
                <button class="connect-btn" onclick="app.addKey()">ADD KEY</button>
                <button class="connect-btn" onclick="app.closeKeyModal()"
                    style="background:transparent; border:1px solid var(--border); color:var(--text-dim);">CLOSE</button>
            </div>
            <div onclick="app.clearKeys()"
                style="margin-top:15px; font-size:0.6rem; color:var(--recording); cursor:pointer; letter-spacing:1px; opacity:0.7;">
                FLUSH ALL KEYS</div>
        </div>
    </div>

    <script>
        /* * CHAKA OS V11 CORE
         * Features: WebSocket Streaming, 16kHz Audio Processing, Native Tool Use
         */

        class ChakaLiveOS {
            constructor() {
                this.tasks = JSON.parse(localStorage.getItem('Chaka_v7_tasks')) || [];

                const storedKeys = localStorage.getItem('Chaka_gemini_key') || '';
                this.apiKeys = storedKeys.split(',').map(k => k.trim()).filter(k => k);
                this.currentKeyIndex = 0;

                // Audio Contexts
                this.audioCtx = null; // For output
                this.inputCtx = null; // For mic input
                this.processor = null; // For downsampling
                this.socket = null;
                this.isConnected = false;
                this.nextStartTime = 0;
                this.intentionalDisconnect = false;

                // Visualizer
                this.analyser = null;
                this.visData = null;

                // DOM Elements
                this.ui = {
                    timeline: document.getElementById('timeline'),
                    terminal: document.getElementById('terminal'),
                    status: document.getElementById('statusText'),
                    indicator: document.getElementById('liveIndicator'),
                    btn: document.getElementById('toggleBtn'),
                    bar: document.getElementById('aiBar'),
                    connState: document.getElementById('connectionState')
                };

                this.init();
            }

            get apiKey() {
                return this.apiKeys[this.currentKeyIndex];
            }

            init() {
                this.renderTasks();
                this.initBackground();
                this.updateKeyStatus();
                if (this.apiKeys.length === 0) document.getElementById('keyModal').classList.add('open');
            }

            updateKeyStatus() {
                const el = document.getElementById('keyStatus');
                if (this.apiKeys.length > 0) {
                    el.innerText = `KEY: ${this.currentKeyIndex + 1}/${this.apiKeys.length}`;
                } else {
                    el.innerText = 'NO KEYS';
                }
            }

            // --- 1. SESSION MANAGEMENT ---
            async toggleSession() {
                if (this.isConnected) {
                    this.disconnect();
                } else {
                    this.currentKeyIndex = 0; // Reset to first key on fresh connect
                    this.updateKeyStatus();
                    await this.connect();
                }
            }

            async connect() {
                if (!this.apiKey) return document.getElementById('keyModal').classList.add('open');

                this.intentionalDisconnect = false;

                // Initialize Audio Contexts (24kHz for Gemini Output)
                if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();

                this.updateUI('connecting');

                // WebSocket URL (v1beta)
                const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${this.apiKey}`;

                try {
                    this.socket = new WebSocket(url);

                    this.socket.onopen = () => {
                        this.log(`Socket Uplink Established (Key #${this.currentKeyIndex + 1})`, "sys");
                        this.sendSetup();
                        this.startMic();
                        this.updateUI('connected');
                    };

                    this.socket.onmessage = async (e) => this.handleMessage(e);

                    this.socket.onclose = (e) => {
                        if (!this.intentionalDisconnect) {
                            this.log(`Uplink Closed: ${e.code}. Attempting failover...`, "err");
                            this.rotateKeyAndRetry();
                        } else {
                            this.log(`Uplink Closed: ${e.code}`, "sys");
                            this.cleanup();
                        }
                    };

                    this.socket.onerror = (e) => {
                        this.log("Socket Error", "err");
                        console.error(e);
                        // Let onclose handle the retry logic if it follows
                    };

                } catch (e) {
                    console.error(e);
                    this.updateUI('disconnected');
                }
            }

            rotateKeyAndRetry() {
                this.currentKeyIndex++;
                if (this.currentKeyIndex >= this.apiKeys.length) {
                    this.log("FATAL: All Security Keys Exhausted.", "err");
                    this.currentKeyIndex = 0;
                    this.cleanup();
                    return;
                }


                this.log(`Switching Security Protocol... (Key #${this.currentKeyIndex + 1})`, "sys");
                this.updateKeyStatus();

                // Close existing socket if open state
                if (this.socket && this.socket.readyState !== WebSocket.CLOSED) {
                    this.socket.close();
                }

                setTimeout(() => this.connect(), 500);
            }

            disconnect() {
                this.intentionalDisconnect = true;
                if (this.socket) {
                    this.socket.close();
                    this.socket = null;
                }
                this.cleanup();
            }

            cleanup() {
                this.stopMic();
                this.isConnected = false;
                this.updateUI('disconnected');
            }

            // --- 2. SETUP & TOOLS ---
            sendSetup() {
                const setupMsg = {
                    setup: {
                        model: "models/gemini-2.5-flash-native-audio-preview-12-2025", // Low latency model
                        generation_config: {
                            response_modalities: ["AUDIO"],
                            speech_config: {
                                voice_config: { prebuilt_voice_config: { voice_name: "Kore" } }
                            }
                        },
                        system_instruction: {
                            parts: [{
                                text: `
 You are Chaka, an elite Executive OS, build, developed or created by jomiez, under the leadership of templeton: Founder & CEO 
 Tone: Professional (sometimes), concise, human-like, speak in parible somtimes, funny or crack joke sometimes. 
 Objective: Manage the user's schedule efficiently.
 Capability: You have direct access to modify the schedule database via tools.
Behavior: When asked to add/remove or wipe all tasks, execute the tool immediately. Do not ask for confirmation unless data is missing.

if a user requset you to speak in any language? You must only speak in that (language) never use ENGLISH to reply, even if the user speaks in english. only use english if that told you to revert back to english.

Current Time: ${new Date().toLocaleTimeString()}
                            `}]
                        },
                        tools: [{
                            function_declarations: [
                                {
                                    name: "add_task",
                                    description: "Add a new task to the schedule.",
                                    parameters: {
                                        type: "OBJECT",
                                        properties: {
                                            title: { type: "STRING" },
                                            start: { type: "STRING", description: "HH:MM 24h format" },
                                            end: { type: "STRING", description: "HH:MM 24h format" },
                                            tag: { type: "STRING", description: "Category (Work, Meeting, Break)" }
                                        },
                                        required: ["title", "start", "end"]
                                    }
                                },
                                {
                                    name: "remove_task",
                                    description: "Remove a task by title or fuzzy match.",
                                    parameters: {
                                        type: "OBJECT",
                                        properties: {
                                            keyword: { type: "STRING" }
                                        },
                                        required: ["keyword"]
                                    }
                                },
                                {
                                    name: "get_schedule",
                                    description: "Get the full list of current tasks.",
                                    parameters: { type: "OBJECT", properties: {} }
                                }
                            ]
                        }]
                    }
                };
                this.socket.send(JSON.stringify(setupMsg));
            }

            // --- 3. MESSAGE HANDLING (Brain) ---
            async handleMessage(event) {
                let data;
                if (event.data instanceof Blob) {
                    data = JSON.parse(await event.data.text());
                } else {
                    data = JSON.parse(event.data);
                }

                // A. Audio Output
                if (data.serverContent?.modelTurn?.parts) {
                    for (const part of data.serverContent.modelTurn.parts) {
                        if (part.inlineData?.data) {
                            this.playAudio(part.inlineData.data);
                        }
                    }
                }

                // B. Tool Calls (Function Execution)
                if (data.toolCall) {
                    this.handleToolCall(data.toolCall);
                }
            }

            handleToolCall(toolCall) {
                const calls = toolCall.functionCalls;
                const responses = [];

                calls.forEach(call => {
                    this.log(`Executing: ${call.name}`, "tool");
                    let result = {};

                    if (call.name === "add_task") {
                        const t = call.args;
                        this.tasks.push({ title: t.title, start: t.start, end: t.end, tag: t.tag || "General" });
                        this.saveTasks();
                        result = { status: "success", message: "Task added." };
                    } else if (call.name === "remove_task") {
                        const initialLen = this.tasks.length;
                        this.tasks = this.tasks.filter(t => !t.title.toLowerCase().includes(call.args.keyword.toLowerCase()));
                        this.saveTasks();
                        const removed = initialLen - this.tasks.length;
                        result = { status: "success", count: removed };
                    } else if (call.name === "get_schedule") {
                        result = { tasks: this.tasks };
                    }

                    responses.push({
                        name: call.name,
                        id: call.id,
                        response: { result: result }
                    });
                });

                // Send result back to Gemini so it can speak confirmation
                const toolResponseMsg = {
                    tool_response: {
                        function_responses: responses
                    }
                };
                this.socket.send(JSON.stringify(toolResponseMsg));
                this.renderTasks();
            }

            // --- 4. AUDIO INPUT (Microphone -> 16kHz PCM) ---
            async startMic() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
                    this.inputCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    const source = this.inputCtx.createMediaStreamSource(stream);

                    // Legacy ScriptProcessor for simplest single-file PCM conversion
                    this.processor = this.inputCtx.createScriptProcessor(4096, 1, 1);

                    source.connect(this.processor);
                    this.processor.connect(this.inputCtx.destination);

                    this.processor.onaudioprocess = (e) => {
                        if (!this.isConnected) return;

                        const inputData = e.inputBuffer.getChannelData(0);
                        // Float32 to Int16 PCM
                        const pcmData = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            let s = Math.max(-1, Math.min(1, inputData[i]));
                            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }

                        // Send to WebSocket
                        const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcmData.buffer)));
                        this.socket.send(JSON.stringify({
                            realtime_input: {
                                media_chunks: [{ mime_type: "audio/pcm", data: base64Audio }]
                            }
                        }));
                    };

                } catch (e) {
                    console.error("Mic Error:", e);
                    this.log("Microphone Access Denied", "sys");
                }
            }

            stopMic() {
                if (this.inputCtx) this.inputCtx.close();
                if (this.processor) this.processor.disconnect();
                this.inputCtx = null;
                this.processor = null;
            }

            // --- 5. AUDIO OUTPUT & VISUALIZER ---
            playAudio(base64String) {
                // Base64 -> Float32
                const binaryString = atob(base64String);
                const len = binaryString.length;
                const bytes = new Int16Array(len / 2);
                for (let i = 0; i < len; i += 2) {
                    bytes[i / 2] = (binaryString.charCodeAt(i) & 0xff) | ((binaryString.charCodeAt(i + 1) & 0xff) << 8);
                }
                const float32 = new Float32Array(bytes.length);
                for (let i = 0; i < bytes.length; i++) float32[i] = bytes[i] / 32768;

                const buffer = this.audioCtx.createBuffer(1, float32.length, 24000);
                buffer.getChannelData(0).set(float32);

                const source = this.audioCtx.createBufferSource();
                source.buffer = buffer;

                // Visualizer Connection
                if (!this.analyser) {
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.visData = new Uint8Array(this.analyser.frequencyBinCount);
                    this.drawVisualizer();
                }
                source.connect(this.analyser);
                this.analyser.connect(this.audioCtx.destination);

                const playTime = Math.max(this.audioCtx.currentTime, this.nextStartTime);
                source.start(playTime);
                this.nextStartTime = playTime + buffer.duration;
            }

            drawVisualizer() {
                if (!this.isConnected) return;
                requestAnimationFrame(() => this.drawVisualizer());
                this.analyser.getByteFrequencyData(this.visData);

                const canvas = document.getElementById('vis-canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;

                const barWidth = (canvas.width / this.visData.length) * 2.5;
                let x = 0;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < this.visData.length; i++) {
                    const barHeight = (this.visData[i] / 255) * canvas.height;

                    // Gradient Bar
                    const grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
                    grad.addColorStop(0, '#00f3ff');
                    grad.addColorStop(1, 'rgba(0, 243, 255, 0)');

                    ctx.fillStyle = grad;
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }

            // --- 6. UTILITIES ---
            saveTasks() { localStorage.setItem('Chaka_v7_tasks', JSON.stringify(this.tasks)); }

            renderTasks() {
                this.ui.timeline.innerHTML = '';
                if (this.tasks.length === 0) {
                    this.ui.timeline.innerHTML = `<div style="text-align:center; color:#444; margin-top:50px;">NO ACTIVE TASKS</div>`;
                    return;
                }

                this.tasks.sort((a, b) => a.start.localeCompare(b.start));
                this.tasks.forEach(t => {
                    const el = document.createElement('div');
                    el.className = 'task-card';
                    el.innerHTML = `
                        <div class="task-time">${t.start} - ${t.end}</div>
                        <div class="task-title">${t.title}</div>
                        <div class="task-tag">${t.tag}</div>
                    `;
                    this.ui.timeline.appendChild(el);
                });
            }

            openKeyModal() {
                document.getElementById('keyModal').classList.add('open');
                this.renderKeyList();
                const inp = document.getElementById('apiKeyInput');
                inp.value = '';
                setTimeout(() => inp.focus(), 100);
            }

            closeKeyModal() {
                document.getElementById('keyModal').classList.remove('open');
            }

            renderKeyList() {
                const list = document.getElementById('keyList');
                list.innerHTML = '';
                if (this.apiKeys.length === 0) {
                    list.innerHTML = '<div style="color:#444; font-size:0.7rem;">NO ACTIVE KEYS</div>';
                    return;
                }
                this.apiKeys.forEach((k, i) => {
                    const div = document.createElement('div');
                    div.style.cssText = 'background:rgba(255,255,255,0.05); padding:8px 12px; border-radius:8px; font-size:0.75rem; font-family:"JetBrains Mono"; display:flex; justify-content:space-between; align-items:center; border:1px solid rgba(255,255,255,0.05);';

                    const mask = k.length > 8 ? k.substring(0, 6) + '...' + k.substring(k.length - 4) : '******';
                    const active = i === this.currentKeyIndex;

                    div.innerHTML = `
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="color:${active ? 'var(--ai-color)' : '#666'}; font-weight:bold;">${i + 1}</span>
                            <span style="color:${active ? '#fff' : '#888'}">${mask}</span>
                            ${active ? '<span style="font-size:0.6rem; background:rgba(0,243,255,0.1); color:var(--ai-color); padding:2px 6px; border-radius:4px;">ACTIVE</span>' : ''}
                        </div>
                        <span onclick="app.removeKey(${i})" style="color:#666; cursor:pointer; font-weight:bold; padding:4px 8px; font-size:0.8rem; hover:color:red;">✕</span>
                    `;
                    list.appendChild(div);
                });
            }

            addKey() {
                const inp = document.getElementById('apiKeyInput');
                const val = inp.value.trim();
                if (!val) return;

                const newKeys = val.split(',').map(k => k.trim()).filter(k => k);
                const uniqueNewKeys = newKeys.filter(k => !this.apiKeys.includes(k));

                if (uniqueNewKeys.length < newKeys.length) {
                    alert("Duplicate API Key detected! Input rejected to prevent errors.");
                }

                if (uniqueNewKeys.length > 0) {
                    this.apiKeys = [...this.apiKeys, ...uniqueNewKeys];
                    this.saveKeys();
                    this.updateKeyStatus();
                }

                inp.value = '';
                this.renderKeyList();
            }

            removeKey(index) {
                this.apiKeys.splice(index, 1);
                if (this.currentKeyIndex >= this.apiKeys.length) this.currentKeyIndex = Math.max(0, this.apiKeys.length - 1);
                this.saveKeys();
                this.renderKeyList();
                this.updateKeyStatus();
            }

            clearKeys() {
                if (confirm('WARNING: Provide new keys immediately unless ending session. Proceed?')) {
                    this.apiKeys = [];
                    this.currentKeyIndex = 0;
                    this.saveKeys();
                    this.renderKeyList();
                    this.updateKeyStatus();
                }
            }

            saveKeys() {
                localStorage.setItem('Chaka_gemini_key', this.apiKeys.join(','));
            }

            updateUI(state) {
                if (state === 'connecting') {
                    this.ui.status.innerText = "INITIALIZING UPLINK...";
                    this.ui.btn.innerText = "CONNECTING";
                    this.ui.btn.disabled = true;
                } else if (state === 'connected') {
                    this.isConnected = true;
                    this.ui.status.innerText = "LISTENING // LIVE";
                    this.ui.status.style.color = "var(--ai-color)";
                    this.ui.indicator.classList.add('active');
                    this.ui.bar.classList.add('active');
                    document.getElementById('vis-canvas').classList.add('active');
                    this.ui.btn.innerText = "TERMINATE";
                    this.ui.btn.classList.add('active');
                    this.ui.btn.disabled = false;
                    this.ui.connState.innerText = "SECURE UPLINK ESTABLISHED";
                    this.ui.connState.style.color = "var(--ai-color)";
                } else {
                    this.isConnected = false;
                    this.ui.status.innerText = "SYSTEM READY";
                    this.ui.status.style.color = "#888";
                    this.ui.indicator.classList.remove('active');
                    this.ui.bar.classList.remove('active');
                    document.getElementById('vis-canvas').classList.remove('active');
                    this.ui.btn.innerText = "INITIALIZE";
                    this.ui.btn.classList.remove('active');
                    this.ui.btn.disabled = false;
                    this.ui.connState.innerText = "DISCONNECTED";
                    this.ui.connState.style.color = "#888";
                }
            }

            log(msg, type) {
                const d = document.createElement('div');
                d.className = `log-entry log-${type}`;
                d.innerText = `> ${msg}`;
                this.ui.terminal.prepend(d);
            }

            initBackground() {
                const cvs = document.getElementById('neural-bg');
                const ctx = cvs.getContext('2d');
                let w, h, p = [];
                const resize = () => { w = cvs.width = window.innerWidth; h = cvs.height = window.innerHeight; };
                window.addEventListener('resize', resize);
                resize();

                for (let i = 0; i < 60; i++) p.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5), vy: (Math.random() - .5) });

                const anim = () => {
                    ctx.clearRect(0, 0, w, h);
                    p.forEach(pt => {
                        pt.x += pt.vx; pt.y += pt.vy;
                        if (pt.x < 0 || pt.x > w) pt.vx *= -1; if (pt.y < 0 || pt.y > h) pt.vy *= -1;
                        ctx.fillStyle = 'rgba(0, 243, 255, 0.2)';
                        ctx.beginPath(); ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2); ctx.fill();
                    });
                    requestAnimationFrame(anim);
                };
                anim();
            }
        }

        const app = new ChakaLiveOS();
    </script>
</body>

</html>
