<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaka // Advanced Contextual Awareness</title>
    <style>
        /* =========================================================
           CHAKA V5 // UNIFIED LIVE HUD (Dark Immersive)
        ========================================================= */
        :root {
            --app-bg: #0a0a0c;
            --app-surface: rgba(28, 28, 30, 0.6);
            --app-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --brand-active: #ff4500;
            --brand-glow: rgba(255, 69, 0, 0.4);
            --shadow-heavy: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--app-bg);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, rgba(255, 69, 0, 0.02) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        .chaka-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 5;
            width: 100%;
        }

        .visualizer-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 2vh;
        }

        #live-visualizer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: pointer;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.15));
        }

        .text-feedback-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            max-width: 600px;
            height: 160px;
            padding: 0 20px;
            z-index: 10;
        }

        .status-text {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            animation: pulseText 2s infinite ease-in-out;
        }

        @keyframes pulseText {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        .transcript-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            mask-image: linear-gradient(to top, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 60%, transparent 100%);
        }

        .live-msg {
            text-align: center;
            font-size: 18px;
            line-height: 1.4;
            padding: 4px 16px;
            opacity: 0;
            transform: translateY(10px);
            animation: msgFadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .live-msg.ai {
            color: var(--text-primary);
            font-weight: 400;
        }

        .live-msg.user {
            color: var(--text-secondary);
            font-weight: 500;
            font-style: italic;
        }

        .live-msg.sys {
            color: var(--brand-active);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @keyframes msgFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chaka-controls {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding-bottom: 40px;
            z-index: 20;
        }

        .action-btn {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--app-border);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: var(--shadow-heavy);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: var(--app-surface);
            color: var(--text-primary);
        }

        .action-btn.secondary {
            width: 56px;
            height: 56px;
        }

        .action-btn.secondary svg {
            width: 22px;
            height: 22px;
        }

        .action-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .action-btn.primary-mic {
            width: 80px;
            height: 80px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .action-btn.primary-mic svg {
            width: 34px;
            height: 34px;
        }

        .action-btn.primary-mic.active {
            background: var(--brand-active);
            color: #fff;
            border-color: var(--brand-active);
            box-shadow: 0 0 25px var(--brand-glow), 0 0 0 0 rgba(255, 69, 0, 0.5);
            animation: micRipple 2s infinite cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes micRipple {
            0% {
                box-shadow: 0 0 20px var(--brand-glow), 0 0 0 0 rgba(255, 69, 0, 0.4);
            }

            70% {
                box-shadow: 0 0 30px var(--brand-glow), 0 0 0 20px rgba(255, 69, 0, 0);
            }

            100% {
                box-shadow: 0 0 20px var(--brand-glow), 0 0 0 0 rgba(255, 69, 0, 0);
            }
        }
    </style>
</head>

<body>

    <main class="chaka-stage">
        <div class="visualizer-container">
            <canvas id="live-visualizer" width="500" height="500"></canvas>
        </div>
        <div class="text-feedback-area">
            <div id="live-status-text" class="status-text">SYSTEM READY</div>
            <div id="live-chat-log" class="transcript-box">
                <div class="live-msg ai">Tap the microphone and talk to me.</div>
            </div>
        </div>
    </main>

    <footer class="chaka-controls">
        <button id="live-keyboard-btn" class="action-btn secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"></path>
            </svg>
        </button>
        <button id="live-mic-btn" class="action-btn primary-mic">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                <path
                    d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
            </svg>
        </button>
        <button id="live-exit-btn" class="action-btn secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </footer>

    <script>
        const canvas = document.getElementById('live-visualizer');
        const ctx = canvas.getContext('2d');
        const micBtn = document.getElementById('live-mic-btn');
        const statusText = document.getElementById('live-status-text');

        let isRecording = false;
        let audioCtx = null, analyser = null, dataArray = null;

        let isMockAiSpeaking = false;
        let mockAiVolTimer = 0;
        let synth = window.speechSynthesis;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                addTestTranscript(`"${transcript}"`, "user");
                simulateAiBrain(transcript);
            };
        }

        // --- ENHANCED EMOTIONS DICTIONARY ---
        let currentEmotion = 'neutral';

        const emotions = {
            neutral: {
                rot: 0, scaleY: 1, bend: 0, width: 12, height: 32, shiftX: 0, shiftY: 0,
                colors: { core: [0, 243, 255], mid: [0, 100, 255], edge: [255, 69, 0], shadow: [0, 100, 255] }
            },
            angry: {
                rot: 0.65, scaleY: 1, bend: 0, width: 14, height: 40, shiftX: -1, shiftY: 6,
                colors: { core: [255, 50, 0], mid: [200, 0, 0], edge: [100, 0, 0], shadow: [255, 0, 0] }
            },
            sad: {
                rot: -0.4, scaleY: 1, bend: 0, width: 12, height: 32, shiftX: -2, shiftY: -2,
                colors: { core: [0, 100, 255], mid: [0, 50, 200], edge: [0, 20, 100], shadow: [0, 50, 255] }
            },
            happy: {
                rot: 0, scaleY: 1, bend: -15, width: 24, height: 8, shiftX: 0, shiftY: 4,
                colors: { core: [0, 243, 255], mid: [0, 100, 255], edge: [255, 69, 0], shadow: [0, 100, 255] }
            },
            surprised: {
                rot: 0, scaleY: 1, bend: 0, width: 20, height: 20, shiftX: 0, shiftY: -4,
                colors: { core: [255, 200, 0], mid: [255, 100, 0], edge: [200, 50, 0], shadow: [255, 150, 0] }
            },
            // NEW: The Thinking State
            thinking: {
                rot: 0, scaleY: 0.8, bend: 0, width: 12, height: 28, shiftX: 0, shiftY: 0,
                colors: { core: [180, 50, 255], mid: [120, 0, 220], edge: [60, 0, 150], shadow: [150, 50, 255] }
            }
        };

        let eyeParams = { ...emotions.neutral };
        let currentColors = JSON.parse(JSON.stringify(emotions.neutral.colors));

        let isBlinking = false;
        let blinkScale = 1;

        // Gaze Tracking variables
        let targetX = 0, targetY = 0;
        let currentEyeX = 0, currentEyeY = 0;
        let currentTilt = 0;
        let lastInteractionTime = Date.now();

        // Used for micro-saccades
        let saccadeTimer = 0;
        let saccadeTargetX = 0;
        let saccadeTargetY = 0;

        function triggerEmotion(emo) {
            if (currentEmotion === emo) return;
            currentEmotion = emo;
        }

        function lerpColor(curr, target, ease) {
            curr[0] += (target[0] - curr[0]) * ease;
            curr[1] += (target[1] - curr[1]) * ease;
            curr[2] += (target[2] - curr[2]) * ease;
        }

        function speakReply(text, emotion) {
            if (synth.speaking) synth.cancel();
            const utterThis = new SpeechSynthesisUtterance(text);

            utterThis.rate = 1.05;
            if (emotion === 'angry') utterThis.pitch = 0.6;
            else if (emotion === 'sad') utterThis.pitch = 0.8;
            else if (emotion === 'happy') utterThis.pitch = 1.2;
            else if (emotion === 'surprised') utterThis.pitch = 1.3;
            else utterThis.pitch = 1.0;

            utterThis.onstart = () => {
                isMockAiSpeaking = true;
                statusText.innerText = "SPEAKING...";
            };

            // Syllable sync spikes
            utterThis.onboundary = (event) => {
                if (event.name === 'word') {
                    mockAiVolTimer = 15; // Set a quick frame timer for the spike
                }
            };

            utterThis.onend = () => {
                isMockAiSpeaking = false;
                statusText.innerText = "LISTENING...";
                setTimeout(() => triggerEmotion('neutral'), 1500);
            };

            synth.speak(utterThis);
        }

        function simulateAiBrain(text) {
            let reply = "I am listening.";
            let newEmotion = 'neutral';

            if (/(happy|love|funny|joke|great|awesome|good|haha)/i.test(text)) {
                newEmotion = 'happy';
                reply = "Haha, that's really great! You're making me smile.";
            } else if (/(angry|mad|hate|annoying|stupid|bad|terrible)/i.test(text)) {
                newEmotion = 'angry';
                reply = "That is extremely frustrating. I am very annoyed right now.";
            } else if (/(sad|cry|sorry|hurt)/i.test(text)) {
                newEmotion = 'sad';
                reply = "I'm so sorry to hear that. I feel really bad for you.";
            } else if (/(wow|amazing|shock|crazy|whoa)/i.test(text)) {
                newEmotion = 'surprised';
                reply = "Wow, really?! That is absolutely crazy!";
            } else {
                reply = "Hmm, I hear you. Please tell me more about that.";
            }

            // 1. Immediately enter THINKING state (Cognitive Latency)
            triggerEmotion('thinking');
            statusText.innerText = "THINKING...";

            // 2. Wait a moment, then respond
            setTimeout(() => {
                triggerEmotion(newEmotion);
                addTestTranscript(reply, "ai");
                speakReply(reply, newEmotion);
            }, 1200); // 1.2s fake network delay to show off the purple thinking aura
        }

        function updateTarget(clientX, clientY) {
            lastInteractionTime = Date.now();
            const rect = canvas.getBoundingClientRect();
            targetX = (((clientX - rect.left) / rect.width) * 2 - 1) * 35;
            targetY = (((clientY - rect.top) / rect.height) * 2 - 1) * 35;
        }

        window.addEventListener('mousemove', (e) => updateTarget(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => updateTarget(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('mouseout', () => { targetX = 0; targetY = 0; });
        window.addEventListener('touchend', () => { targetX = 0; targetY = 0; });

        let time = 0;

        function drawFace() {
            requestAnimationFrame(drawFace);
            time += 0.02;
            const now = Date.now();
            const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;

            ctx.clearRect(0, 0, w, h);

            let vol = 0;

            // Priority 1: User Mic Volume
            if (isRecording && analyser && !isMockAiSpeaking) {
                analyser.getByteFrequencyData(dataArray);
                vol = (dataArray.reduce((a, b) => a + b) / dataArray.length) / 255;
            }

            // Priority 2: AI is Speaking (Driven by TTS Word Boundaries)
            let aiVolSpike = 0;
            if (isMockAiSpeaking) {
                if (mockAiVolTimer > 0) {
                    aiVolSpike = 0.5 + (Math.random() * 0.3); // Spike up
                    mockAiVolTimer--;
                } else {
                    aiVolSpike = 0.1; // Base speaking hum
                }
                vol = aiVolSpike;
            }

            // --- ADVANCED CONTEXTUAL TRACKING ---
            let isIdle = (now - lastInteractionTime) > 1500;
            let headTilt = 0;

            if (vol > 0.08 && !isMockAiSpeaking) {
                // ATTENTION TRACKING: User is speaking! Snap to center immediately.
                targetX = 0;
                targetY = 0;
                headTilt = 0;
                lastInteractionTime = now; // Wake up the system
            } else if (currentEmotion === 'thinking') {
                // THINKING STATE: Look up and to the right while processing
                targetX = 18;
                targetY = -22;
                headTilt = 0.1;
            } else if (isIdle) {
                // IDLE STATE: Wandering & Micro-Saccades
                saccadeTimer--;

                if (saccadeTimer <= 0) {
                    if (Math.random() < 0.03) {
                        // 3% chance to trigger a quick eye dart to a random spot
                        saccadeTargetX = (Math.random() * 50) - 25;
                        saccadeTargetY = (Math.random() * 40) - 20;
                        saccadeTimer = 40; // Hold the gaze for a bit
                    } else {
                        // Smoothly wander
                        saccadeTargetX = Math.sin(time * 1.2) * 20 + Math.cos(time * 0.7) * 15;
                        saccadeTargetY = Math.sin(time * 0.9) * 15 + Math.cos(time * 1.5) * 10;
                    }
                }

                targetX = saccadeTargetX;
                targetY = saccadeTargetY;
                headTilt = Math.sin(time * 0.8) * 0.15;
            }

            // --- SMOOTH MORPH ENGINE ---
            const target = emotions[currentEmotion];
            const shapeEase = 0.08;
            const colorEase = 0.04;

            eyeParams.rot += (target.rot - eyeParams.rot) * shapeEase;
            eyeParams.scaleY += (target.scaleY - eyeParams.scaleY) * shapeEase;
            eyeParams.bend += (target.bend - eyeParams.bend) * shapeEase;
            eyeParams.width += (target.width - eyeParams.width) * shapeEase;
            eyeParams.height += (target.height - eyeParams.height) * shapeEase;
            eyeParams.shiftX += (target.shiftX - eyeParams.shiftX) * shapeEase;
            eyeParams.shiftY += (target.shiftY - eyeParams.shiftY) * shapeEase;

            lerpColor(currentColors.core, target.colors.core, colorEase);
            lerpColor(currentColors.mid, target.colors.mid, colorEase);
            lerpColor(currentColors.edge, target.colors.edge, colorEase);
            lerpColor(currentColors.shadow, target.colors.shadow, colorEase);

            let audioScale = 1;
            let talkBob = 0;

            if (vol > 0.1) {
                if (currentEmotion !== 'surprised' && currentEmotion !== 'thinking') {
                    audioScale = 1 - Math.min(0.4, vol * 1.2);
                }
                talkBob = Math.sin(time * 40) * (vol * 5);
            }

            if (isBlinking) {
                blinkScale -= 0.3;
                if (blinkScale <= 0) { blinkScale = 0; isBlinking = false; }
            } else {
                blinkScale += 0.2;
                if (blinkScale >= 1) blinkScale = 1;
                // Don't blink while thinking, it breaks the "processing" look
                if (Math.random() < 0.005 && currentEmotion !== 'thinking') isBlinking = true;
            }

            // Fast tracking for mouse, slightly slower tracking for idle wandering
            const trackingSpeed = isIdle ? 0.04 : 0.08;
            currentEyeX += (targetX - currentEyeX) * trackingSpeed;
            currentEyeY += (targetY - currentEyeY) * trackingSpeed;
            currentTilt += (headTilt - currentTilt) * 0.05;

            // --- Draw Holographic Orb ---
            const baseRadius = 130 + (vol * 50) + Math.sin(time * 2) * 3;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(time * 0.5 + (vol * 2));

            const gradient = ctx.createRadialGradient(0, 0, baseRadius * 0.2, 0, 0, baseRadius);

            gradient.addColorStop(0, `rgba(${currentColors.core[0]}, ${currentColors.core[1]}, ${currentColors.core[2]}, 0.9)`);
            gradient.addColorStop(0.4, `rgba(${currentColors.mid[0]}, ${currentColors.mid[1]}, ${currentColors.mid[2]}, 0.8)`);
            gradient.addColorStop(0.7, `rgba(${currentColors.edge[0]}, ${currentColors.edge[1]}, ${currentColors.edge[2]}, 0.7)`);
            gradient.addColorStop(1, `rgba(0, 0, 0, 0)`);

            ctx.beginPath();
            for (let i = 0; i <= Math.PI * 2; i += 0.1) {
                const waveSpike = 15 + (vol * 45);
                const waveSpeed = 2 + (vol * 10);
                const wave = Math.sin(i * 3 + time * waveSpeed) * waveSpike + Math.cos(i * 5 - time) * (waveSpike * 0.6);

                ctx.lineTo(Math.cos(i) * (baseRadius + wave), Math.sin(i) * (baseRadius + wave));
            }
            ctx.closePath();

            ctx.fillStyle = gradient;
            ctx.shadowColor = `rgba(${currentColors.shadow[0]}, ${currentColors.shadow[1]}, ${currentColors.shadow[2]}, 0.5)`;
            ctx.shadowBlur = 40 + (vol * 50);
            ctx.fill();
            ctx.restore();

            // --- Draw The Expressive Eyes ---
            ctx.save();
            const breathingBob = Math.sin(time * 3) * 4;
            ctx.translate(cx + currentEyeX, cy + currentEyeY + breathingBob + talkBob);
            ctx.rotate(currentTilt);

            const eyeSpacing = 24;
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 15;

            function drawEye(isLeft) {
                ctx.save();
                const dir = isLeft ? -1 : 1;

                ctx.translate(dir * eyeSpacing + (dir * eyeParams.shiftX), eyeParams.shiftY);
                ctx.rotate(dir * eyeParams.rot);
                ctx.scale(1, Math.max(0.01, eyeParams.scaleY * audioScale * blinkScale));

                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const w = eyeParams.width;
                const h = eyeParams.height;
                const b = eyeParams.bend;
                const rad = Math.min(w / 2, h / 2, 6);

                ctx.beginPath();
                ctx.moveTo(-w / 2 + rad, -h / 2);

                if (b !== 0) { ctx.quadraticCurveTo(0, -h / 2 + b, w / 2 - rad, -h / 2); }
                else { ctx.lineTo(w / 2 - rad, -h / 2); }

                ctx.arcTo(w / 2, -h / 2, w / 2, -h / 2 + rad, rad);
                ctx.lineTo(w / 2, h / 2 - rad);
                ctx.arcTo(w / 2, h / 2, w / 2 - rad, h / 2, rad);

                if (b !== 0) { ctx.quadraticCurveTo(0, h / 2 + b, -w / 2 + rad, h / 2); }
                else { ctx.lineTo(-w / 2 + rad, h / 2); }

                ctx.arcTo(-w / 2, h / 2, -w / 2, h / 2 - rad, rad);
                ctx.lineTo(-w / 2, -h / 2 + rad);
                ctx.arcTo(-w / 2, -h / 2, -w / 2 + rad, -h / 2, rad);
                ctx.closePath();

                if (Math.abs(b) > 5 && h < 10) { ctx.stroke(); }
                else { ctx.fill(); }

                ctx.restore();
            }

            drawEye(true);
            drawEye(false);

            ctx.restore();
        }

        drawFace();

        // --- Mic Control ---
        async function toggleMic() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 64;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);

                    const source = audioCtx.createMediaStreamSource(stream);
                    source.connect(analyser);

                    isRecording = true;
                    micBtn.classList.add('active');
                    statusText.innerText = "LISTENING...";
                    statusText.style.color = "#ff4500";

                    if (recognition) recognition.start();

                } catch (err) { alert("Mic Error: " + err.message); }
            } else {
                isRecording = false;
                micBtn.classList.remove('active');
                statusText.innerText = "SYSTEM READY";
                statusText.style.color = "#8e8e93";

                if (audioCtx) audioCtx.close();
                if (recognition) recognition.stop();
                if (synth.speaking) synth.cancel();
            }
        }
        micBtn.addEventListener('click', toggleMic);

        function addTestTranscript(text, sender) {
            const log = document.getElementById('live-chat-log');
            const div = document.createElement("div");
            div.className = `live-msg ${sender}`;
            div.innerText = text;
            log.appendChild(div);
            if (log.children.length > 3) log.removeChild(log.firstChild);
        }
    </script>
</body>

</html>
